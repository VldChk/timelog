name: Sanitizers

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sanitizers-${{ github.ref }}
  cancel-in-progress: true

env:
  ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
  UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

jobs:
  sanitizers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip -r requirements-test.txt

      - name: Configure (Debug + sanitizers)
        run: >
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug
          -DTIMELOG_BUILD_PYTHON=ON
          -DTIMELOG_BUILD_PY_TESTS=ON
          -DTIMELOG_BUILD_PY_FACADE_TESTS=OFF

      - name: Build e2e targets
        run: cmake --build build-asan --target timelog_e2e_build --config Debug -j 2

      - name: Resolve sanitizer runtime preload
        shell: bash
        run: |
          libasan="$(gcc -print-file-name=libasan.so)"
          libubsan="$(gcc -print-file-name=libubsan.so)"
          preload="${libasan}"
          if [ -n "${libubsan}" ] && [ "${libubsan}" != "libubsan.so" ]; then
            preload="${preload}:${libubsan}"
          fi
          echo "LD_PRELOAD=${preload}" >> "${GITHUB_ENV}"

      - name: Run pure C tests by group (sanitizers)
        shell: bash
        # Leak detection is ON for the pure-C leg (no CPython interpreter
        # noise here). .lsan-suppressions covers only the two
        # test_snapshot_lifetime misuse tests that leak by design. The Python
        # legs below keep the global detect_leaks=0 because the interpreter
        # itself reports leaks. Regression guard for the v1.3 shared-memview
        # wrapper leak fix (core/src/delta/tl_memview.c).
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/.lsan-suppressions
        run: |
          set +e
          python demo/ci/run_core_test_groups.py \
            --build-dir build-asan \
            --config Debug \
            --ctest-regex '^timelog_tests$' \
            --summary-json "${RUNNER_TEMP}/sanitizers-core-summary.json" \
            --summary-md "${RUNNER_TEMP}/sanitizers-core-summary.md" \
            2>&1 | tee "${RUNNER_TEMP}/sanitizers-core.log"
          exit_code=${PIPESTATUS[0]}
          exit $exit_code

      - name: Run C-level CPython binding tests (sanitizers)
        if: success()
        shell: bash
        run: |
          set +e
          ctest --test-dir build-asan -C Debug --output-on-failure -R '^py_.*_tests$' \
            2>&1 | tee "${RUNNER_TEMP}/sanitizers-bindings.log"
          exit_code=${PIPESTATUS[0]}
          exit $exit_code

      - name: Run Python facade tests (sanitizers)
        if: success()
        shell: bash
        run: |
          set +e
          cmake -E env "PYTHONPATH=${GITHUB_WORKSPACE}/python" \
            python -m pytest python/tests -q \
            2>&1 | tee "${RUNNER_TEMP}/sanitizers-pyfacade.log"
          exit_code=${PIPESTATUS[0]}
          exit $exit_code

      - name: Run demo tests (sanitizers)
        if: success()
        shell: bash
        run: |
          set +e
          cmake -E env "PYTHONPATH=${GITHUB_WORKSPACE}/python" \
            python -m pytest demo/tests -q \
            2>&1 | tee "${RUNNER_TEMP}/sanitizers-demo.log"
          exit_code=${PIPESTATUS[0]}
          exit $exit_code

      - name: Upload sanitizer artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizers-failure-logs
          path: |
            ${{ runner.temp }}/sanitizers-core-summary.json
            ${{ runner.temp }}/sanitizers-core-summary.md
            ${{ runner.temp }}/sanitizers-core.log
            ${{ runner.temp }}/sanitizers-bindings.log
            ${{ runner.temp }}/sanitizers-pyfacade.log
            ${{ runner.temp }}/sanitizers-demo.log

  thread-sanitizer-subinterpreters:
    name: thread-sanitizer-subinterpreters (ubuntu-latest, 3.14)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      TSAN_OPTIONS: halt_on_error=1:report_signal_unsafe=0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip -r requirements-test.txt

      - name: Configure (Debug + ThreadSanitizer)
        run: >
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug
          -DTIMELOG_SANITIZER=thread
          -DTIMELOG_BUILD_PYTHON=ON
          -DTIMELOG_BUILD_PY_TESTS=ON
          -DTIMELOG_BUILD_PY_FACADE_TESTS=OFF

      - name: Build e2e targets
        run: cmake --build build-tsan --target timelog_e2e_build --config Debug -j 2

      - name: Resolve ThreadSanitizer runtime preload
        shell: bash
        run: |
          libtsan="$(gcc -print-file-name=libtsan.so)"
          if [ -n "${libtsan}" ] && [ "${libtsan}" != "libtsan.so" ]; then
            echo "LD_PRELOAD=${libtsan}" >> "${GITHUB_ENV}"
          fi

      - name: Run subinterpreter tests under ThreadSanitizer
        shell: bash
        run: |
          set +e
          cmake -E env "PYTHONPATH=${GITHUB_WORKSPACE}/python" \
            python demo/ci/run_compat_baseline.py \
              --legs subinterpreters \
              --summary-json "${RUNNER_TEMP}/tsan-subinterpreters.json" \
              --summary-md "${RUNNER_TEMP}/tsan-subinterpreters.md" \
            2>&1 | tee "${RUNNER_TEMP}/tsan-subinterpreters.log"
          exit_code=${PIPESTATUS[0]}
          exit $exit_code

      - name: Upload ThreadSanitizer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsan-subinterpreters
          path: |
            ${{ runner.temp }}/tsan-subinterpreters.json
            ${{ runner.temp }}/tsan-subinterpreters.md
            ${{ runner.temp }}/tsan-subinterpreters.log

  thread-sanitizer-freethreaded:
    # ThreadSanitizer + free-threaded CPython 3.14t. This is the only CI
    # leg that combines genuine Py_GIL_DISABLED parallelism with TSan
    # instrumentation — the right place to surface free-threading races
    # in the Layer B synchronization primitives. Marked continue-on-error
    # while 3.14t runner availability and TSan/CPython interaction
    # stabilize; will become required once consistently green.
    name: thread-sanitizer-freethreaded (ubuntu-latest, 3.14t)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14t"
          allow-prereleases: true

      - name: Verify free-threaded build
        env:
          PYTHON_GIL: "0"
        run: |
          python -c "import sys, sysconfig; \
            assert sysconfig.get_config_var('Py_GIL_DISABLED') == 1, \
            'expected Py_GIL_DISABLED=1 build but got regular interpreter'; \
            assert sys._is_gil_enabled() is False, \
            'expected PYTHON_GIL=0 to disable the runtime GIL'"

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip -r requirements-test.txt

      - name: Configure (RelWithDebInfo + ThreadSanitizer)
        run: >
          cmake -S . -B build-tsan-ft -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DTIMELOG_SANITIZER=thread
          -DTIMELOG_BUILD_PYTHON=ON
          -DTIMELOG_BUILD_PY_TESTS=ON
          -DTIMELOG_BUILD_PY_FACADE_TESTS=OFF

      - name: Build e2e targets
        run: cmake --build build-tsan-ft --target timelog_e2e_build --config RelWithDebInfo -j 2

      - name: Resolve ThreadSanitizer runtime preload
        shell: bash
        run: |
          libtsan="$(gcc -print-file-name=libtsan.so)"
          if [ -n "${libtsan}" ] && [ "${libtsan}" != "libtsan.so" ]; then
            echo "LD_PRELOAD=${libtsan}" >> "${GITHUB_ENV}"
          fi

      - name: Run freethreading + stress legs under ThreadSanitizer
        shell: bash
        env:
          TIMELOG_SHORT_STRESS: "1"
          # log_path routes TSan reports to files (pytest's capture swallows the
          # inline report). suppressions filters known CPython-internal BRC noise
          # so only timelog-frame races surface. runner.temp is only valid once a
          # job is assigned to a runner, so keep this at step scope.
          TSAN_OPTIONS: "halt_on_error=0:second_deadlock_stack=1:report_signal_unsafe=0:suppressions=${{ github.workspace }}/.tsan-suppressions:log_path=${{ runner.temp }}/tsan-report"
        run: |
          set +e
          # setarch -R disables ASLR: TSan otherwise fails with
          # "unexpected memory mapping" on recent kernels.
          setarch -R cmake -E env "PYTHONPATH=${GITHUB_WORKSPACE}/python" \
            "PYTHON_GIL=0" \
            python demo/ci/run_compat_baseline.py \
              --legs freethreading \
              --summary-json "${RUNNER_TEMP}/tsan-freethreaded.json" \
              --summary-md "${RUNNER_TEMP}/tsan-freethreaded.md" \
            2>&1 | tee "${RUNNER_TEMP}/tsan-freethreaded.log"
          exit_code=${PIPESTATUS[0]}
          # TSan writes unsuppressed reports to ${RUNNER_TEMP}/tsan-report.<pid>.
          # Count any surviving TSan report there (not pytest stdout, which
          # swallows the inline report). Suppressed CPython-BRC noise is excluded
          # by the suppressions file, so any remaining report is actionable.
          tsan_reports=0
          for f in "${RUNNER_TEMP}"/tsan-report.*; do
            [ -e "${f}" ] || continue
            n=$(grep -cE "(WARNING|ERROR): ThreadSanitizer" "${f}" || true)
            tsan_reports=$((tsan_reports + n))
          done
          if [ "${tsan_reports}" -gt 0 ]; then
            echo "::error::ThreadSanitizer reported ${tsan_reports} unsuppressed issues"
            cat "${RUNNER_TEMP}"/tsan-report.* 2>/dev/null || true
            exit 1
          fi
          exit $exit_code

      - name: Upload ThreadSanitizer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsan-freethreaded
          path: |
            ${{ runner.temp }}/tsan-freethreaded.json
            ${{ runner.temp }}/tsan-freethreaded.md
            ${{ runner.temp }}/tsan-freethreaded.log
