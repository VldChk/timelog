name: Packaging (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "core/**"
      - "bindings/**"
      - "python/**"
      - "pyproject.toml"
      - "CMakeLists.txt"
      - ".github/workflows/packaging-pr.yml"

concurrency:
  group: packaging-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaging-pr:
    strategy:
      fail-fast: false
      matrix:
        # cp313 is the default regular build; cp314t verifies that the
        # free-threaded ABI wheel imports and runs the full suite under
        # Py_GIL_DISABLED.
        include:
          - python: "3.13"
            cibw_build: "cp313-manylinux_x86_64"
            wheel_tag: "cp313"
          # The cp314t leg MUST set up the free-threaded interpreter ("3.14t"):
          # the host Python becomes the smoke-test venv base, and a cp314t ABI
          # wheel only installs on a Py_GIL_DISABLED interpreter. Using plain
          # "3.14" here would make the smoke + Py_mod_gil check run on a regular
          # GIL build (and the cp314t wheel would fail to install).
          - python: "3.14t"
            cibw_build: "cp314t-manylinux_x86_64"
            wheel_tag: "cp314t"
    runs-on: ubuntu-latest
    name: packaging-pr (${{ matrix.wheel_tag }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine cibuildwheel

      - name: Build sdist
        if: matrix.wheel_tag == 'cp313'
        run: python -m build --sdist

      - name: Build representative wheel (${{ matrix.cibw_build }})
        env:
          CIBW_BUILD: ${{ matrix.cibw_build }}
          CIBW_ARCHS_LINUX: x86_64
          CIBW_CONFIG_SETTINGS: >-
            cmake.define.TIMELOG_BUILD_PYTHON=true
            cmake.define.TIMELOG_BUILD_PY_TESTS=false
            cmake.define.TIMELOG_BUILD_PY_FACADE_TESTS=false
            cmake.define.TIMELOG_STAGE_PYTHON_MODULE=false
            cmake.define.TIMELOG_STRICT_WARNINGS=false
            cmake.define.TIMELOG_BUILD_CORE_TESTS=false
            cmake.define.TIMELOG_BUILD_DEMOS=false
            cmake.define.TIMELOG_BUILD_SHARED=false
        run: python -m cibuildwheel --output-dir dist

      - name: Verify package metadata
        run: python -m twine check dist/*

      - name: Wheel install + smoke tests
        shell: bash
        env:
          # Bound the free-threaded stress/freethreading harnesses so the
          # smoke run stays fast; full-depth soak lives in the sanitizer legs.
          TIMELOG_SHORT_STRESS: "1"
        run: |
          python -m venv .venv-wheel
          source .venv-wheel/bin/activate
          # For the cp314t leg the smoke venv MUST be a Py_GIL_DISABLED
          # interpreter: otherwise the cp314t ABI wheel cannot install and the
          # Py_mod_gil check below would run on a regular GIL build (no signal).
          if [ "${{ matrix.wheel_tag }}" = "cp314t" ]; then
            python - <<'PY'
          import sys, sysconfig
          assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1, (
              "cp314t smoke must run on a free-threaded interpreter; got a "
              f"regular GIL build: {sys.version}"
          )
          print("Smoke venv is free-threaded (Py_GIL_DISABLED=1). OK.")
          PY
          fi
          python -m pip install --upgrade pip
          wheel_path="$(ls dist/timelog_lib-*${{ matrix.wheel_tag }}*.whl)"
          python -m pip install "${wheel_path}[test]"
          python -m pytest python/tests -q
          python - <<'PY'
          from timelog import Timelog, __version__
          with Timelog() as log:
              log.append(1, "ok")
              rows = list(log[1:2])
              assert rows == [(1, "ok")]
          print(__version__)
          PY

      - name: Verify Py_mod_gil declaration honored (free-threaded only)
        if: matrix.wheel_tag == 'cp314t'
        shell: bash
        run: |
          source .venv-wheel/bin/activate
          PYTHON_GIL=0 python - <<'PY'
          import sys
          before = sys._is_gil_enabled()
          import timelog
          after = sys._is_gil_enabled()
          assert before is False, "PYTHON_GIL=0 should disable GIL"
          assert after is False, (
              "Importing timelog re-enabled the GIL on a free-threaded "
              "build. Py_mod_gil = Py_MOD_GIL_NOT_USED was not honored."
          )
          print("Free-threaded import keeps GIL disabled. OK.")
          PY

      - name: Upload packaging artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaging-pr-dist-${{ matrix.wheel_tag }}
          path: dist/*
