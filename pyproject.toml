[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "timelog-lib"
version = "1.2.0"
description = "In-memory LSM-style time-indexed storage engine with CPython bindings."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Timelog Contributors" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-timeout>=2.3"]

[project.urls]
Homepage = "https://github.com/VldChk/timelog"
Repository = "https://github.com/VldChk/timelog"
Issues = "https://github.com/VldChk/timelog/issues"

[tool.scikit-build]
cmake.source-dir = "."
cmake.build-type = "Release"
wheel.packages = ["python/timelog"]
install.components = ["python"]

[tool.scikit-build.cmake.define]
TIMELOG_BUILD_PYTHON = true
TIMELOG_BUILD_PY_TESTS = false
TIMELOG_BUILD_PY_FACADE_TESTS = false
TIMELOG_STAGE_PYTHON_MODULE = false
TIMELOG_STRICT_WARNINGS = false
TIMELOG_BUILD_CORE_TESTS = false
TIMELOG_BUILD_DEMOS = false
TIMELOG_BUILD_SHARED = false

[tool.cibuildwheel]
# Build for regular CPython 3.12-3.14 on all supported OSes. Free-threaded
# cp314t wheels are limited to Linux until macOS/Windows cp314t hosts are part
# of the required CI matrix.
# 3.13t is intentionally omitted (spec §6.10: "explicitly tested only").
build = "cp312-* cp313-* cp314-* cp314t-manylinux_x86_64 cp314t-manylinux_aarch64"
skip = "*-musllinux_*"
test-command = "pytest {project}/python/tests -q"
# Bound the free-threaded stress/freethreading harnesses during the
# per-wheel test phase. Full-depth soak runs in the dedicated sanitizer
# and compat-baseline CI legs; the cp314t wheel test only needs to confirm
# the free-threaded ABI imports and exercises the race windows briefly.
# TIMELOG_SHORT_STRESS=1 switches _iters() to its quick counts so the test
# phase stays bounded on every configured wheel platform.
test-environment = { TIMELOG_SHORT_STRESS = "1" }
test-extras = ["test"]

[[tool.cibuildwheel.overrides]]
select = "cp314t-*"
test-environment = { TIMELOG_SHORT_STRESS = "1", PYTHON_GIL = "0" }

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.pytest.ini_options]
markers = [
    "subinterpreters: compatibility baseline tests for isolated interpreter support",
    "freethreading: compatibility baseline tests for free-threaded/no-GIL support",
    "stress: opt-in compatibility stress harnesses for lifetime and concurrency",
    "timeout(timeout): fail a test when pytest-timeout is installed and runtime exceeds the bound",
]
